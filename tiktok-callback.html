<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3AM Stories – TikTok sign-in</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:0 auto;padding:32px 16px;line-height:1.6;color:#1f2328;background:#fff}h1{font-size:1.6rem;margin-bottom:.2rem}h2{font-size:1.1rem;margin-top:1.8rem}.updated{color:#59636e;margin-top:0}a{color:#0969da}nav{margin:0 0 24px;padding-bottom:12px;border-bottom:1px solid #d1d9e0}nav a{margin-right:18px}.yt{display:inline-flex;align-items:center;gap:8px;background:#ff0000;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:600}.yt svg{width:22px;height:16px}footer{margin-top:40px;padding-top:12px;border-top:1px solid #d1d9e0;color:#59636e;font-size:.9rem}</style>
</head>
<body>
<h1>3AM Stories – TikTok sign-in</h1>
<p id="msg">Reading the sign-in result…</p>
<p><code id="code" style="word-break:break-all"></code></p>
<script>
var q=new URLSearchParams(location.search), c=q.get("code"), e=q.get("error");
var m=document.getElementById("msg");
if(c){m.textContent="Signed in. Copy this one-time code back to the 3AM Stories uploader (it expires in a few minutes):";document.getElementById("code").textContent=c;}
else if(e){m.textContent="Sign-in was not completed: "+e+" "+(q.get("error_description")||"");}
else{m.textContent="This page receives the TikTok sign-in result for the 3AM Stories uploader.";}
</script>
<footer>Operated by AI Memelord · <a href="tiktok-privacy.html">Privacy</a> · <a href="tiktok-terms.html">Terms</a></footer>
</body>
</html>
